[project]
name = "resume"
version = "0.1.0"
description = "Микросервис резюме, предоствялающий информацию для главной страницы сайта (Обо мне)"
authors = [
    {name = "Alexey",email = "Starobogatov.a@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12, <4"
dependencies = [
    "fastapi[all] (>=0.115.12,<0.116.0)",
    "hypercorn (>=0.17.3,<0.18.0)",
    "sqlalchemy[async] (>=2.0.40,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "sqlmodel (>=0.0.24,<0.0.25)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
