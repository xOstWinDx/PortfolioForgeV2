[project]
name = "blog"
version = "0.1.0"
description = "Микросервис блога, обрабатывает посты и комментарии авторизованных пользователей."
authors = [
    {name = "OstWinD",email = "Starobogatov.alexey@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13, <4"
dependencies = [
    "sqlalchemy[all] (>=2.0.40,<3.0.0)",
    "fastapi[all] (>=0.115.12,<0.116.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "motor (>=3.7.0,<4.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
