[project]
name = "auth"
version = "0.1.0"
description = "Микросервис регистрации/аутентификации/авторизации пользователей"
authors = [
    {name = "Alexey",email = "Starobogatov.a@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi[all] (>=0.115.12,<0.116.0)",
    "cryptography (>=44.0.2,<45.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "hypercorn (>=0.17.3,<0.18.0)",
    "sqlalchemy[async] (>=2.0.40,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "alembic (>=1.15.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pre-commit = "^4.2.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"

